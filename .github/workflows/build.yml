name: Compilación de APK de Android

on:
  push:
    branches: [ main, principal ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Descargar código fuente
      uses: actions/checkout@v4

    - name: Configurar Java 21
      uses: actions/setup-java@v5
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Configurar Node.js 24
      uses: actions/setup-node@v4
      with:
        node-version: '24'

    - name: Preparar entorno Capacitor y Gradle
      run: |
        mkdir -p www
        if [ -f "calc.html" ]; then cp calc.html www/index.html; fi
        npm init -y
        npm install @capacitor/core @capacitor/cli @capacitor/android
        chmod -R +x node_modules/.bin
        ./node_modules/.bin/cap init "Calculadora CAS" "com.uagrm.cas" --web-dir "www"
        ./node_modules/.bin/cap add android || true
        ./node_modules/.bin/cap sync android

    - name: Compilar APK con Gradle
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Subir archivo APK listo
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: android/app/build/outputs/apk/debug/app-debug.apk
